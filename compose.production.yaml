name: cansat-recruitment

services:
  web:
    build:
      context: .
    image: ${APP_IMAGE:-cansat-recruitment:local}
    restart: unless-stopped
    init: true
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-cansat}
      DB_USER: ${DB_USER:-cansat_app}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      DB_AUTO_INIT: "false"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    networks:
      - frontend
      - database
    security_opt:
      - no-new-privileges:true

  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cansat}
      MARIADB_USER: ${DB_USER:-cansat_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - database_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  database:
    internal: true

volumes:
  database_data:
