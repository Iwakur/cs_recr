post_max_size = 256K
upload_max_filesize = 256K
max_input_vars = 200
max_input_nesting_level = 4
memory_limit = 128M
max_execution_time = 30
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
session.use_strict_mode = 1
